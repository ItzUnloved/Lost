<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="CSS/styles.css">

</head>

<body>

    <main>

        <h1>Contact Us</h1>

        <form id="contact-form"
              action="https://formspree.io/f/xdekoyob"
              method="POST">

            <!-- Name -->
            <label for="name">Name</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Your name"
                required
            >


            <!-- Email -->
            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="your@email.com"
                required
            >


            <!-- Subject -->
            <label for="subject">Subject</label>

            <input
                type="text"
                id="subject"
                name="subject"
                placeholder="Subject"
                required
            >


            <!-- Message -->
            <label for="message">Message</label>

            <textarea
                id="message"
                name="message"
                placeholder="Write your message here..."
                rows="8"
                required
            ></textarea>


            <!-- Submit -->
            <button type="submit" id="submit-button">
                Send Message
            </button>


            <!-- Status message -->
            <p id="form-status"></p>

        </form>

    </main>


    <script>
        const form = document.getElementById("contact-form");
        const status = document.getElementById("form-status");
        const submitButton = document.getElementById("submit-button");


        form.addEventListener("submit", async function(event) {

            // Prevent the browser from leaving the page
            event.preventDefault();


            // Change button while submitting
            submitButton.disabled = true;
            submitButton.textContent = "Sending...";

            status.textContent = "";


            // Collect form information
            const formData = new FormData(form);


            try {

                // Send the form to Formspree
                const response = await fetch(form.action, {

                    method: "POST",

                    body: formData,

                    headers: {
                        "Accept": "application/json"
                    }

                });


            if (response.ok) {
                status.textContent = "Your message has been sent successfully!";
                form.reset();
            } else if (response.status === 429) {
                status.textContent =
                "Sorry, the monthly limit has been reached, either try different contact method, or please wait till available again.";
            } else {
                status.textContent =
                "Something went wrong. Please try again.";
            }

            } catch (error) {

                // Network or connection error
                status.textContent =
                    "Something went wrong. Please try again.";

            }


            // Restore button
            submitButton.disabled = false;
            submitButton.textContent = "Send Message";

        });

    </script>

</body>

</html>
