				<h2 class="style-logo" style="color: #565744;">Architectural Services </h2>
				<nav class="style-nav">

						<li><a href="Index.html" class="hover-underline-animation" style="font-family: Garamond;">Home</a></li>
						<li><a href="Services.html" class="hover-underline-animation" style="font-family: Garamond;">Services</a></li>
						<li><a href="#" class="hover-underline-animation" style="font-family: Garamond;">Templates</a></li>

					</ul>
				</nav>
			</div>
		</div>
	</header>
	
	<main>
		<div class="row">
			<div class="col">
			  
			</div>
		</div>
		<div class="row"> </div>
		<div class="row">
<div class="slideshow-container">
    <div class="slide fade">
        <img src="images/image1.png" alt="Architectural Project 1">
    </div>

    <div class="slide fade">
        <img src="images/image2.png" alt="Architectural Project 2">
    </div>

    <div class="slide fade">
        <img src="images/image3.png" alt="Architectural Project 3">
    </div>

    <div class="slide fade">
        <img src="images/image4.png" alt="Architectural Project 4">
    </div>

    <!-- Previous and Next buttons -->
    <a class="prev" onclick="changeSlide(-1)">&#10094;</a>
    <a class="next" onclick="changeSlide(1)">&#10095;</a>

</div>

<!-- Dots -->
<div class="dots">
    <span class="dot" onclick="currentSlide(1)"></span>
    <span class="dot" onclick="currentSlide(2)"></span>
    <span class="dot" onclick="currentSlide(3)"></span>
    <span class="dot" onclick="currentSlide(4)"></span>
</div>

	</main>
	
	<footer>
		<div class="row">
			<div class="col">
				<p class="footer-text"><b>©2026 Jennifer Julisa Pineda. All rights reserved.</b></p>
			</div>
		</div>
	</footer>

<script>
let slideIndex = 1;
let slideTimer;

showSlide(slideIndex);

function changeSlide(n) {
    showSlide(slideIndex += n);
    resetTimer();
}

function currentSlide(n) {
    showSlide(slideIndex = n);
    resetTimer();
}

function showSlide(n) {
    let slides = document.getElementsByClassName("slide");
    let dots = document.getElementsByClassName("dot");

    if (n > slides.length) {
        slideIndex = 1;
    }

    if (n < 1) {
        slideIndex = slides.length;
    }

    for (let i = 0; i < slides.length; i++) {
        slides[i].style.display = "none";
    }

    for (let i = 0; i < dots.length; i++) {
        dots[i].style.backgroundColor = "#bbb";
    }

    slides[slideIndex - 1].style.display = "block";
    dots[slideIndex - 1].style.backgroundColor = "#555546";
}

function startTimer() {
    slideTimer = setInterval(function() {
        showSlide(slideIndex += 1);
    }, 5000);
}

function resetTimer() {
    clearInterval(slideTimer);
    startTimer();
}

startTimer();
</script>
</body>
</html>
